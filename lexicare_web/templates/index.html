<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexiCare — Syllable & Visual Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F0F5;--paper:#F8FBFD;--ink:#1B2733;--muted:#576878;--line:#C5D3DE;
--s0:#1D5FB8;--s1:#C2570C;--hl:#FFE7A0;--accent:#0F6B6B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 Lexend,Verdana,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0;font-size:2rem;font-weight:600}
.lead{margin:4px 0 20px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,button{font:inherit;border-radius:10px}
input[type=text]{flex:1;min-width:200px;padding:12px 14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
select{padding:8px 10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
button{padding:10px 18px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
button.alt{background:transparent;color:var(--accent)}
:focus-visible{outline:3px solid var(--s0);outline-offset:2px}
label{color:var(--muted);font-size:.9rem}
.stage{display:grid;grid-template-columns:1fr 280px;gap:20px;margin-top:20px}
#reading{min-height:220px;font-size:clamp(1.9rem,4.5vw,2.7rem);font-weight:600;line-height:1.8;letter-spacing:.04em;word-spacing:.3em}
#reading:empty::before{content:"Your syllables will appear here.";font-size:1.1rem;font-weight:400;color:var(--muted);letter-spacing:0}
.word{cursor:pointer;border-radius:8px;padding:2px 4px}
.word:hover{background:#E3EDF4}
.word.active{background:var(--hl)}
.word.guess{text-decoration:underline dotted;text-underline-offset:8px}
.s0{color:var(--s0)}.s1{color:var(--s1)}.dot{color:var(--muted);font-weight:400}
.pic{text-align:center}
#pic{max-width:100%;max-height:240px;border-radius:10px}
#cap{margin:8px 0 0;font-weight:600;color:var(--muted)}
#status{margin:14px 2px 0;color:var(--muted);font-size:.95rem;min-height:1.5em}
details{margin-top:20px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
details .row{margin-top:12px}
@media (max-width:720px){.stage{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root{--bg:#141C24;--paper:#1B2631;--ink:#E8EEF3;--muted:#9FB0BF;--line:#33424F;--s0:#7DB3F5;--s1:#F2A15F;--hl:#5A4B12;--accent:#2E9C9C}.word:hover{background:#243342}input[type=text],select{background:#111A22}}
</style>
</head>
<body>
<main>
  <h1>LexiCare</h1>
  <p class="lead">Type a word or a sentence. Click any word to hear it and see a picture.</p>

  <section class="card">
    <div class="row">
      <input id="text" type="text" placeholder="Try: The elephant danced" aria-label="Word or sentence" autofocus>
      <button onclick="run()">Show syllables</button>
      <button class="alt" onclick="clearAll()">Clear</button>
    </div>
    <div class="row" style="margin-top:12px">
      <label for="voice">Voice</label><select id="voice"></select>
      <label for="rate">Speed</label>
      <select id="rate">
        <option value="0.6">Very slow</option><option value="0.75" selected>Slow</option>
        <option value="0.9">Medium</option><option value="1">Normal</option>
      </select>
    </div>
    <div class="stage">
      <div id="reading" aria-live="polite"></div>
      <div class="pic"><img id="pic" alt="" hidden><p id="cap"></p></div>
    </div>
    <p id="status">Enter a word or sentence to begin.</p>

    <details>
      <summary>Fix or report a syllable split</summary>
      <p id="picked">Click a word above first.</p>
      <label for="split">Correct split (separate syllables with hyphens)</label>
      <div class="row">
        <input id="split" type="text" placeholder="el-e-phant">
        <button onclick="saveFix()">Save correction</button>
        <button class="alt" onclick="removeFix()">Remove saved correction</button>
      </div>
      <div class="row">
        <input id="reason" type="text" placeholder="Optional: why is the split wrong?">
        <button class="alt" onclick="report()">Report incorrect split</button>
      </div>
    </details>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const state = {words: [], sel: null};
let voices = [];

async function api(url, method = "GET", body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"},
                              body: body && JSON.stringify(body)});
  return r.json().catch(() => ({}));
}
const note = t => $("status").textContent = t;

/* Voice: the browser's built-in speech replaces pyttsx3 */
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  $("voice").replaceChildren(...(voices.length ? voices.map(v => new Option(v.name)) : [new Option("Default voice")]));
}
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function speak(text) {
  if (!("speechSynthesis" in window)) return note("This browser can't read aloud. Try Chrome, Edge or Safari.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(v => v.name === $("voice").value);
  if (v) u.voice = v;
  u.rate = +$("rate").value;
  speechSynthesis.speak(u);
}

function render() {
  const box = $("reading");
  box.replaceChildren();
  state.words.forEach((w, i) => {
    const el = document.createElement("span");
    el.className = "word" + (!w.confident && w.source !== "user" ? " guess" : "") + (i === state.sel ? " active" : "");
    el.tabIndex = 0;
    w.parts.forEach((p, k) => {
      const s = document.createElement("span");
      s.className = "s" + (k % 2);
      s.textContent = p;
      el.append(s);
      if (k < w.parts.length - 1) {
        const d = document.createElement("span");
        d.className = "dot"; d.textContent = "·";
        el.append(d);
      }
    });
    el.onclick = () => select(i);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); } };
    box.append(el, " ");
  });
  const guesses = state.words.filter(w => !w.confident && w.source !== "user").length;
  note(`${state.words.length} words · ${state.words.reduce((n, w) => n + w.parts.length, 0)} syllables`
       + (guesses ? ` · ${guesses} estimated splits underlined` : ""));
}

function loadImage(word) {
  const img = $("pic");
  img.hidden = true;
  $("cap").textContent = "Looking for an image…";
  img.onload = () => { img.hidden = false; img.alt = word; $("cap").textContent = word; };
  img.onerror = () => { img.hidden = true; $("cap").textContent = "No image found."; };
  img.src = "/api/image?q=" + encodeURIComponent(word);
}

function select(i) {
  state.sel = i;
  const w = state.words[i];
  render();
  $("picked").textContent = "Selected: " + w.word;
  $("split").value = w.parts.join("-");
  $("reason").value = "";
  speak(w.word);
  loadImage(w.word);
}

async function run() {
  const raw = $("text").value.trim();
  if (!raw) return note("Type a word or sentence first.");
  const d = await api("/api/syllabify", "POST", {text: raw});
  if (!d.words || !d.words.length) return note("No English words found in that text.");
  state.words = d.words; state.sel = null;
  render();
  d.words.length === 1 ? select(0) : speak(raw);
}

function clearAll() {
  state.words = []; state.sel = null;
  $("text").value = ""; $("split").value = ""; $("reason").value = "";
  $("reading").replaceChildren();
  $("pic").hidden = true; $("cap").textContent = "";
  $("picked").textContent = "Click a word above first.";
  note("Enter a word or sentence to begin.");
  speechSynthesis.cancel();
}

async function saveFix() {
  const w = state.words[state.sel];
  if (!w) return note("Click a word first.");
  const parts = $("split").value.split("-").map(s => s.trim());
  const d = await api("/api/correct", "POST", {word: w.word, parts});
  if (!d.ok) return note(d.error || "Could not save.");
  Object.assign(w, {parts, confident: true, source: "user"});
  render();
  note(`Saved. LexiCare will use your split for "${w.word}".`);
}

async function removeFix() {
  const w = state.words[state.sel];
  if (!w) return note("Click a word first.");
  const d = await api("/api/correct", "DELETE", {word: w.word});
  if (!d.ok) return note(d.error || "Could not remove.");
  Object.assign(w, {parts: d.parts, confident: d.confident, source: d.source});
  $("split").value = w.parts.join("-");
  render();
}

async function report() {
  const w = state.words[state.sel];
  if (!w) return note("Click a word first.");
  const suggested = $("split").value.split("-").map(s => s.trim()).filter(Boolean);
  const d = await api("/api/report", "POST", {word: w.word, shown: w.parts, suggested, reason: $("reason").value});
  note(d.ok ? "Report saved. Thank you." : "Could not save the report.");
}

$("text").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
